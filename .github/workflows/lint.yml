name: Lint & Format

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: markdownlint
        run: npm run lint:md

      - name: stylelint
        run: npm run lint:css

      - name: eslint
        run: npm run lint:js

      - name: prettier (check)
        run: npm run format:check

      - name: check lint-disable comments
        run: npm run check:disable-comments

      - name: check lint config for disabled rules
        run: npm run check:lint-config
