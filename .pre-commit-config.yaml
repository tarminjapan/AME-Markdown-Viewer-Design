repos:
  - repo: local
    hooks:
      - id: check-package-lock
        name: check package-lock.json exists
        entry: bash -c 'test -f package-lock.json || { echo "Error: package-lock.json not found. Run npm install to generate it."; exit 1; }'
        language: system
        files: ^package\.json$
        pass_filenames: false
      - id: markdownlint
        name: markdownlint
        entry: npx markdownlint "**/*.md" ".cursorrules" ".windsurfrules" ".github/copilot-instructions.md"
        language: system
        types_or: [markdown, file]
        pass_filenames: false

      - id: stylelint
        name: stylelint
        entry: npx stylelint "**/*.css"
        language: system
        types: [css]
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: npx eslint .
        language: system
        types: [javascript]
        pass_filenames: false

      - id: prettier
        name: prettier (check)
        entry: npx prettier --check "**/*.md" "**/*.css" "**/*.js" ".cursorrules" ".windsurfrules"
        language: system
        types_or: [markdown, css, javascript, file]
        pass_filenames: false

      - id: check-disable-comments
        name: check lint-disable comments
        entry: node scripts/check-disable-comments.js
        language: system
        types_or: [markdown, css, javascript, file]
        pass_filenames: false

      - id: check-lint-config
        name: check lint config for disabled rules
        entry: node scripts/check-lint-config.js
        language: system
        types_or: [markdown, css, javascript, file]
        pass_filenames: false
